[package]
name = "swap-provider"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "pubky-swap provider daemon: advertises offers and facilitates swaps with a local LND node"

[features]
default = []
# Enable the real LND gRPC backend (requires protoc at build time).
lnd = ["lightning-backend/lnd"]
# Enable the BDK-backed on-chain funding wallet (lives in swap-common).
bdk-wallet = ["swap-common/bdk-wallet"]
# Enable the Electrum chain watcher.
chain = ["swap-common/electrum"]
# A read-only status API on loopback, for a dashboard or a health check.
status = ["dep:axum", "dep:tower-http"]
# Use a beignet daemon for Lightning and/or the on-chain wallet. Needs no protoc.
beignet = ["dep:beignet-backend"]
# Everything needed to actually execute swaps end-to-end.
full = ["lnd", "bdk-wallet", "chain", "status"]
# Learn interested client pubkys over the iroh P2P rendezvous (doorbell) instead of only the
# follow graph. See pubky-transport's `p2p` module.
iroh = ["pubky-transport/iroh"]

[dependencies]
pubky-transport.workspace = true
swap-common.workspace = true
swap-config.workspace = true
lightning-backend.workspace = true
beignet-backend = { workspace = true, optional = true }
bitcoin.workspace = true
tokio.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
uuid.workspace = true
hex.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
# The status API (feature `status`). Optional so the default build pulls in no HTTP server.
axum = { version = "0.8", optional = true }
tower-http = { version = "0.6", features = ["set-header"], optional = true }

[dev-dependencies]
# The scriptable ChainWatcher used by the unit tests.
swap-common = { workspace = true, features = ["test-util"] }
# Needed to implement the async LightningBackend trait for test mocks.
async-trait.workspace = true
# Needed by integration tests to name these crates directly. The `bitcoinconsensus` feature
# enables `Transaction::verify`, so a driver test can check that a claim it built is actually
# valid against the output it spends, rather than only that a claim was broadcast.
bitcoin = { version = "0.32", features = ["bitcoinconsensus"] }
lightning-backend.workspace = true
swap-client.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing-subscriber.workspace = true
