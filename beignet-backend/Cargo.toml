[package]
name = "beignet-backend"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "beignet HTTP daemon adapter: a LightningBackend and an OnchainWallet for pubky-swap"

[dependencies]
lightning-backend.workspace = true
swap-common.workspace = true
bitcoin.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
hex.workspace = true
tokio.workspace = true
# `default-features = false` keeps this from adding anything: reqwest 0.12, hyper and rustls are
# already in the lockfile via the pkarr/pubky stack, and Cargo unifies features additively.
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[features]
default = ["tls"]
# beignet's daemon is plain HTTP on loopback by default and only serves HTTPS when started with
# --tls-cert/--tls-key, so TLS is separable.
tls = ["reqwest/rustls-tls"]

[dev-dependencies]
wiremock = "0.6"
swap-common = { workspace = true }
tokio = { workspace = true }
