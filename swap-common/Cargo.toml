[package]
name = "swap-common"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Shared types for the pubky-swap marketplace: wire messages, swap state machine, and HTLC scripts"

[dependencies]
bitcoin.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
hex.workspace = true
rand.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
# `time` for the fee-bump loop; `rt`/`rt-multi-thread` for `chain::blocking` (block_in_place).
tokio = { version = "1", features = ["time", "rt", "rt-multi-thread"] }

# Electrum-backed chain watcher (feature `electrum`). Kept optional so the default build
# pulls no networking stack.
# The version bdk_electrum pins, so the two agree on `bitcoin` and on the client type itself.
electrum-client = { version = "0.25", optional = true }
# BDK funding wallet (feature `bdk-wallet`). Optional so the default build stays light.
#
# Persistence is not optional here: a memory-backed wallet rescans from scratch on every start
# and hands out the same address every time. `rusqlite` gives the wallet a durable store, and
# `bundled` compiles SQLite in so it needs no system library.
bdk_wallet = { version = "3.1", features = [
    "keys-bip39",
    "rusqlite",
], optional = true }
bdk_electrum = { version = "0.24", optional = true }
# The same rusqlite bdk_chain uses, with SQLite compiled in so the wallet database needs no
# system library. Naming it here is what lets `bundled` be turned on; bdk exposes the
# dependency but not that feature.
rusqlite = { version = "0.31", features = ["bundled"], optional = true }

[dev-dependencies]
# Enables Transaction::verify (libbitcoinconsensus) so tests validate the claim/refund
# witnesses against real Bitcoin script consensus rules. Test builds only.
bitcoin = { version = "0.32", features = ["bitcoinconsensus"] }
# The async runtime for `#[tokio::test]` (fee-bump loop tests).
tokio = { version = "1", features = ["macros", "rt", "time"] }

[features]
default = []
electrum = ["dep:electrum-client"]
# A scriptable ChainWatcher for downstream crates' tests. Always on in this crate's own tests.
test-util = []
bdk-wallet = ["dep:bdk_wallet", "dep:bdk_electrum", "dep:rusqlite"]
