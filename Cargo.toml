[workspace]
members = [
    "beignet-backend",
    "swap-config",
    "pubky-transport",
    "swap-common",
    "lightning",
    "swap-provider",
    "swap-client",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Corey Phillips"]
license = "MIT"

[workspace.dependencies]
# Bitcoin (P2WSH HTLC MVP; Taproot/MuSig2 is a planned phase-2 upgrade, see ROADMAP.md).
# Pinned together with electrum-client and bdk_wallet: all three exchange `bitcoin` types across
# their boundaries, so a mismatch in majors is a compile error at best and two incompatible
# `Txid`s at worst.
bitcoin = "0.32"

# Pubky & Pkarr (same versions proven in bitcoin-batch-coordinator)
pubky-messenger = { version = "0.3.0" }
pkarr = "3.10"
# Recovery-file decryption, for the iroh identity. One `pkarr` resolves across this and
# pubky-messenger, so their `Keypair` is the same type and the secret is the same secret.
pubky-common = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Utilities
uuid = { version = "1.0", features = ["v4", "serde"] }
hex = "0.4"
blake3 = "1.5"
rand = "0.8"
thiserror = "1.0"
anyhow = "1.0"

# Layered configuration: CLI over environment over file over defaults.
figment = { version = "0.10", features = ["toml", "env"] }
toml = "0.8"

# CLI / logging
clap = { version = "4.0", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Internal crates
pubky-transport = { path = "pubky-transport" }
swap-common = { path = "swap-common" }
lightning-backend = { path = "lightning" }
beignet-backend = { path = "beignet-backend" }
swap-client = { path = "swap-client" }
swap-config = { path = "swap-config" }
