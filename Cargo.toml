[workspace]
members = [
    "paykit-identity",
    "beignet-backend",
    "swap-config",
    "pubky-transport",
    "swap-common",
    "lightning",
    "swap-provider",
    "swap-client",
]
resolver = "2"
# Their own workspaces and lockfiles: see their manifests.
exclude = ["paykit-identity/homeserver-test", "pubky-transport/homeserver-test"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Corey Phillips"]
license = "MIT"

[workspace.dependencies]
# Bitcoin contracts: legacy P2WSH and optional Boltz-compatible Taproot script paths.
# Pinned together with electrum-client and bdk_wallet: all three exchange `bitcoin` types across
# their boundaries, so a mismatch in majors is a compile error at best and two incompatible
# `Txid`s at worst.
bitcoin = "0.32"

# Pubky & Pkarr: the versions pubky 0.16.2 builds on, which paykit-rs uses too, so the whole tree
# resolves one pubky, one pubky-common and one pkarr.
pubky-messenger = { git = "https://github.com/coreyphillips/pubky-messenger", rev = "9ebe9f95e211549ae240993a15d1b917c9f176b7" }
pkarr = "8.1"
# Recovery-file decryption, for the iroh identity. One `pkarr` resolves across this and
# pubky-messenger, so their `Keypair` is the same type and the secret is the same secret.
pubky-common = "0.16.2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Utilities
uuid = { version = "1.0", features = ["v4", "serde"] }
hex = "0.4"
blake3 = "1.5"
rand = "0.8"
thiserror = "1.0"
anyhow = "1.0"

# Layered configuration: CLI over environment over file over defaults.
figment = { version = "0.10", features = ["toml", "env"] }
toml = "0.8"

# CLI / logging
clap = { version = "4.0", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Internal crates
pubky-transport = { path = "pubky-transport" }
swap-common = { path = "swap-common" }
lightning-backend = { path = "lightning" }
beignet-backend = { path = "beignet-backend" }
swap-client = { path = "swap-client" }
swap-config = { path = "swap-config" }
paykit-identity = { path = "paykit-identity" }
