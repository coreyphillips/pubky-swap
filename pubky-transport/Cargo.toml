[package]
name = "pubky-transport"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Generic, message-type-agnostic transport over pubky-messenger (encrypted DMs + follow-graph peer discovery)"

[features]
# Direct P2P rendezvous over iroh (NAT-holepunched QUIC, discovery via pkarr/mainline).
iroh = ["dep:iroh", "dep:bip39", "dep:pubky-common", "dep:pubky-session"]

[dependencies]
fs2 = "0.4"
pubky-messenger.workspace = true
pkarr.workspace = true
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true
thiserror.workspace = true
futures.workspace = true
tracing.workspace = true
iroh = { version = "=1.2.0", optional = true }
tokio.workspace = true
bip39 = { version = "2.2", optional = true }
pubky-common = { workspace = true, optional = true }
pubky-session = { package = "pubky", version = "=0.11.0", optional = true }

[dev-dependencies]
pubky-homeserver = "0.1.2"
pubky-testnet = "0.1.2"
tempfile = "3"
# Local DHT and raw-public-key TLS for the authorization lookup fixture in `session_rpc`.
mainline = { version = "8", default-features = false }
tokio-rustls = { version = "0.26", default-features = false }
tokio = { workspace = true, features = ["test-util"] }
