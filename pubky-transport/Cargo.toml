[package]
name = "pubky-transport"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Generic, message-type-agnostic transport over pubky-messenger (encrypted DMs + follow-graph peer discovery)"

[features]
# Direct P2P rendezvous over iroh (NAT-holepunched QUIC, discovery via pkarr/mainline).
iroh = ["dep:iroh", "dep:tokio", "dep:bip39", "dep:pubky-common"]

[dependencies]
pubky-messenger.workspace = true
pkarr.workspace = true
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true
thiserror.workspace = true
futures.workspace = true
tracing.workspace = true
iroh = { version = "=1.0.2", optional = true }
tokio = { workspace = true, optional = true }
bip39 = { version = "2.2", optional = true }
pubky-common = { workspace = true, optional = true }
