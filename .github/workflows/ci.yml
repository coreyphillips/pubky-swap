name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt / clippy / build / unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # protoc is needed to compile the LND backend (feature `lnd`).
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (default + all feature combos)
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy -p swap-common --features electrum,bdk-wallet,test-util --all-targets -- -D warnings
          cargo clippy -p swap-provider --features full --all-targets -- -D warnings
          cargo clippy -p swap-client --features full --all-targets -- -D warnings
          # beignet needs no protoc, so it also builds in the default job.
          cargo clippy -p beignet-backend --all-targets -- -D warnings
          # The lnd backend's own targets, including the `#[ignore]`d smoke test. Without this
          # line nothing built it, and it had drifted out of compiling with the trait it tests.
          cargo clippy -p lightning-backend --features lnd --all-targets -- -D warnings
          cargo clippy -p swap-config --all-targets -- -D warnings
          cargo clippy -p swap-provider --features full,beignet --all-targets -- -D warnings
          cargo clippy -p swap-client --features full,beignet --all-targets -- -D warnings

      - name: Build (default + full)
        run: |
          cargo build --all
          cargo build -p swap-provider --features full
          cargo build -p swap-client --features full
          cargo build -p swap-provider --features full,beignet
          cargo build -p swap-client --features full,beignet

      - name: Unit tests
        run: |
          cargo test --all
          cargo test -p pubky-transport --features iroh --lib
          cargo test -p swap-provider --features full --lib
